datasource.default = rapit

datasource.rapit.username = ${DB_USER_NAME:postgres}
datasource.rapit.password = ${DB_PASSWORD:postgres}
datasource.rapit.url = jdbc:postgresql://${DB_HOST_NAME:localhost}:5432/${DB_NAME:rapit}
datasource.rapit.driver = org.postgresql.Driver

ebean.dbSchema = rapit
ebean.migration.run = true
dbmigration.createSchemaIfNotExists = true
