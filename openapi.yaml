openapi: 3.0.3
info:
  title: rest-api-template
  version: 1.0.0
  description: >
    Layered REST API (Javalin + Ebean + PostgreSQL). Update this spec in the same
    task as any API-surface change - see AGENTS.md -> Change workflow. When XSRF
    protection is enabled, GET responses return an `x-xsrf-token` header and
    matching HttpOnly cookie; clients echo the header on mutating requests.
servers:
  - url: http://localhost:8080/v1/
tags:
  - name: genres
  - name: members
  - name: monitoring
paths:
  /genres:
    get:
      tags: [genres]
      summary: List genres
      description: |
        With both pagination params -> a populated `PagedGenres` envelope. With neither ->
        the same envelope with only `data` populated (memory risk on large tables; triggers
        a runtime WARN). Supplying only one parameter returns 400.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/RecordsPerPage'
      responses:
        '200':
          description: Paged envelope; pagination metadata is null when both parameters are absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGenres'
        '400': { $ref: '#/components/responses/TextBadRequest' }
        '404':
          $ref: '#/components/responses/MessageNotFound'
      security: []
    post:
      tags: [genres]
      summary: Add genre
      x-required-role: MANAGER
      security: [{ secureTokenCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreCreate'
      responses:
        '201':
          description: Created genre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400': { $ref: '#/components/responses/ValidationBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /genres/{id}:
    delete:
      tags: [genres]
      summary: Delete genre
      x-required-role: ADMIN
      security: [{ secureTokenCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/OperationBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /members:
    post:
      tags: [members]
      summary: Create member (registration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        '201':
          description: Created member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Validation errors keyed by field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
  /members/{id}:
    get:
      tags: [members]
      summary: Find member by ID
      security: [{ secureTokenCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Member with phones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400': { $ref: '#/components/responses/TextBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MessageNotFound' }
  /metrics:
    get:
      tags: [monitoring]
      summary: Prometheus metrics
      security: [{ monitoringBasic: [] }]
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Missing or wrong credentials
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Basic realm="metrics"' }
components:
  parameters:
    PageNumber:
      name: pageNumber
      in: query
      schema: { type: integer, format: int32, minimum: 1 }
    RecordsPerPage:
      name: recordsPerPage
      in: query
      description: Values above 10 are capped at 10.
      schema: { type: integer, format: int32, minimum: 1 }
  responses:
    MessageNotFound:
      description: Data not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationBadRequest:
      description: Validation errors keyed by request field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
    OperationBadRequest:
      description: Invalid path parameter or operation could not be completed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
        text/plain:
          schema: { type: string }
    TextBadRequest:
      description: Malformed, non-positive, incomplete, or oversized pagination parameters
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Missing/invalid/expired token
      content:
        text/plain:
          schema: { type: string }
    Forbidden:
      description: Insufficient role (or XSRF failure)
      content:
        text/plain:
          schema: { type: string }
  schemas:
    AuditFields:
      type: object
      properties:
        id: { type: integer, format: int32 }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    Genre:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          properties:
            name: { type: string }
            key: { type: string, nullable: true }
            imagePath: { type: string, nullable: true }
            imageKey: { type: string, nullable: true }
            orderNumber: { type: integer, format: int32 }
    GenreCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 10 }
        key: { type: string }
        imagePath: { type: string, maxLength: 255 }
        imageKey: { type: string }
        orderNumber: { type: integer, format: int32 }
    PagedGenres:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Genre' }
        pageNumber: { type: integer, format: int32, nullable: true }
        numberOfPages: { type: integer, format: int32, nullable: true }
        recordsPerPage: { type: integer, format: int32, nullable: true }
        numberOfRecords: { type: integer, format: int32, nullable: true }
    PhoneNumber:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          properties:
            phoneNo: { type: string }
            isHomePhoneNo: { type: boolean }
    Member:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          properties:
            name: { type: string }
            sex: { type: integer, format: int32, nullable: true }
            phones:
              type: array
              items: { $ref: '#/components/schemas/PhoneNumber' }
    MemberCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 10 }
        phones:
          type: array
          description: May be omitted by clients; the server default is an empty array. Explicit null is invalid.
          items: { type: string, minLength: 1, maxLength: 255 }
          default: []
    Message:
      type: object
      properties:
        msg: { type: string }
    ValidationErrors:
      type: object
      additionalProperties:
        type: array
        items: { type: string }
  securitySchemes:
    secureTokenCookie:
      type: apiKey
      in: cookie
      name: secure-token
    monitoringBasic:
      type: http
      scheme: basic
